<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model Y Configurator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        canvas { display: block; }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px 32px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #aaa;
        }

        .color-options {
            display: flex;
            gap: 8px;
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }

        .color-swatch:hover {
            transform: scale(1.15);
        }

        .color-swatch.active {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .wheel-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            transition: all 0.2s;
        }

        .wheel-option:hover {
            transform: scale(1.1);
        }

        .wheel-option.active {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        #title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        #info {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="title">Tesla Model Y</div>
        <div id="info">Drag to rotate • Scroll to zoom</div>
        <div id="controls">
            <div class="control-group">
                <label>Exterior Color</label>
                <div class="color-options" id="exterior-colors">
                    <div class="color-swatch active" data-color="#e8e8e8" style="background:#e8e8e8" title="Pearl White"></div>
                    <div class="color-swatch" data-color="#1a1a1a" style="background:#1a1a1a" title="Solid Black"></div>
                    <div class="color-swatch" data-color="#1e3a5f" style="background:#1e3a5f" title="Deep Blue"></div>
                    <div class="color-swatch" data-color="#8b0000" style="background:#8b0000" title="Red Multi-Coat"></div>
                    <div class="color-swatch" data-color="#4a4a4a" style="background:#4a4a4a" title="Midnight Silver"></div>
                </div>
            </div>
            <div class="control-group">
                <label>Wheels</label>
                <div class="color-options" id="wheel-options">
                    <div class="wheel-option active" data-wheel="gemini" title="19&quot; Gemini">19"</div>
                    <div class="wheel-option" data-wheel="induction" title="20&quot; Induction">20"</div>
                </div>
            </div>
            <div class="control-group">
                <label>Interior</label>
                <div class="color-options" id="interior-colors">
                    <div class="color-swatch active" data-color="#1a1a1a" style="background:#1a1a1a" title="Black"></div>
                    <div class="color-swatch" data-color="#f5f0e8" style="background:#f5f0e8" title="White"></div>
                    <div class="color-swatch" data-color="#8b4513" style="background:#8b4513" title="Tan"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="tesla-model-y.js?v=3"></script>
</body>
</html>
