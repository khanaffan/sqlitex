name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        shared: [ON, OFF]
        # Skip shared builds on macOS to keep matrix manageable
        exclude:
          - os: macos-latest
            shared: ON
          # bcVFS requires curl/OpenSSL; skip on Windows for now
          - os: windows-latest
            shared: ON

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl openssl

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  # ============================================================================
  # Additional job: build with SQLITEX_BCVFS=ON (Linux only)
  # Runs bcVFS integration tests against an Azurite storage emulator.
  # ============================================================================
  build-bcvfs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and start Azurite
        run: |
          npm install -g azurite
          mkdir -p /tmp/azurite
          azurite --silent --location /tmp/azurite &
          # Wait for Azurite to be ready (max 15 seconds)
          for i in $(seq 1 15); do
            if curl -s http://127.0.0.1:10000/devstoreaccount1 2>/dev/null; then
              echo "Azurite ready on attempt $i"
              break
            fi
            echo "Waiting for Azurite... attempt $i"
            sleep 1
          done

      - name: Configure CMake (BCVFS=ON)
        run: >
          cmake -B build-bcvfs
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=ON

      - name: Build
        run: cmake --build build-bcvfs --parallel

      - name: Test
        run: ctest --test-dir build-bcvfs --output-on-failure --parallel
