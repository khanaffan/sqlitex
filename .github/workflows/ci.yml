name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        shared: [ON, OFF]
        # Skip shared builds on macOS to keep matrix manageable
        exclude:
          - os: macos-latest
            shared: ON
          # bcVFS requires curl/OpenSSL; skip on Windows for now
          - os: windows-latest
            shared: ON

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curl openssl

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  # ============================================================================
  # Additional job: build with SQLITEX_BCVFS=ON (Linux only)
  # This catches any linker errors in bcvfs / prefetch code that would not
  # be detected by the main matrix (which always uses BCVFS=OFF).
  # ============================================================================
  build-bcvfs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Configure CMake (BCVFS=ON)
        run: >
          cmake -B build-bcvfs
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=ON

      - name: Build
        run: cmake --build build-bcvfs --parallel

      - name: Test
        run: ctest --test-dir build-bcvfs --output-on-failure --parallel
