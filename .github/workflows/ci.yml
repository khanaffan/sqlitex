name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # Formatting check (clang-format)
  # ============================================================================
  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Configure CMake (format target only)
        run: >
          cmake -B build-fmt
          -DSQLITEX_BCVFS=OFF
          -DSQLITEX_BUILD_TESTS=OFF
          -DSQLITEX_BUILD_EXAMPLES=OFF

      - name: Check formatting
        run: cmake --build build-fmt --target clang-format-check

  # ============================================================================
  # Core build: zero external deps, static & shared across all platforms,
  # plus install + find_package(sqlitex CONFIG REQUIRED) consumer smoke test.
  # ============================================================================
  build:
    name: build (${{ matrix.os }}, ${{ matrix.build_type }}, shared=${{ matrix.shared }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
        shared: [OFF, ON]
        # Keep macOS/Windows Debug focused on static; verify shared on Release.
        exclude:
          - os: macos-latest
            build_type: Debug
            shared: ON
          - os: windows-latest
            build_type: Debug
            shared: ON

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure --parallel

      - name: Install and verify find_package consumer (Release)
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          INSTALL_PREFIX="${GITHUB_WORKSPACE}/install-prefix"
          cmake --install build --config Release --prefix "${INSTALL_PREFIX}"
          mkdir -p consumer-src
          cat > consumer-src/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(sqlitex_consumer LANGUAGES CXX)
          find_package(sqlitex CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE sqlitex::sqlitex)
          get_target_property(_sqlitex_type sqlitex::sqlitex TYPE)
          if(WIN32 AND _sqlitex_type STREQUAL "SHARED_LIBRARY")
              add_custom_command(TARGET consumer POST_BUILD
                  COMMAND ${CMAKE_COMMAND} -E copy_if_different
                      $<TARGET_FILE:sqlitex::sqlitex>
                      $<TARGET_FILE_DIR:consumer>
              )
          endif()
          EOF
          cat > consumer-src/main.cpp << 'EOF'
          #include <sqlitex/sqlitex.h>
          #include <string>

          int main() {
              sqlitex::Database db(":memory:");
              db.execute("CREATE TABLE t(id INTEGER PRIMARY KEY, name TEXT)");
              db.statement_cache().execute("INSERT INTO t VALUES (?, ?)", 1, "ok");
              auto val = db.statement_cache().query_value<std::string>(
                  "SELECT name FROM t WHERE id = ?", 1);
              if (!val || *val != "ok") {
                  return 1;
              }
              {
                  sqlitex::ScopedPolicy policy(db);
                  policy.read_only();
                  if (db.query_value<int64_t>("SELECT COUNT(*) FROM t") != 1) {
                      return 2;
                  }
              }
              sqlitex::Session session(db, "main");
              session.attach("t");
              db.execute("INSERT INTO t VALUES (2, 'two')");
              auto cs = session.changeset();
              if (cs.empty()) {
                  return 3;
              }
              return 0;
          }
          EOF
          cmake -S consumer-src -B consumer-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${INSTALL_PREFIX}"
          cmake --build consumer-build --config Release --parallel
          if [ -x consumer-build/Release/consumer.exe ]; then
            ./consumer-build/Release/consumer.exe
          else
            ./consumer-build/consumer
          fi

  # ============================================================================
  # Sanitizers (ASan + UBSan) on Linux via CMakePresets.json, with bcVFS
  # offline tests and all runnable examples.
  # ============================================================================
  sanitizers:
    name: ASan + UBSan (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Configure (asan preset)
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan --parallel

      - name: Test
        run: ctest --preset asan --parallel

      - name: Run examples under ASan + UBSan
        run: |
          ./build/asan/examples/basic_usage
          ./build/asan/examples/statement_cache
          ./build/asan/examples/scoped_policy
          ./build/asan/examples/session_tracking
          ./build/asan/examples/changeset_apply
          ./build/asan/examples/changegroup_merge

  # ============================================================================
  # bcVFS build: SQLITEX_BCVFS=ON with the bcVFS integration tests run against
  # an Azurite storage emulator. Runs on Linux, macOS and Windows.
  # ============================================================================
  build-bcvfs:
    name: bcVFS + Azurite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl openssl@3

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install curl openssl

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "${RUNNER_TEMP}/azurite"
          azurite --silent --location "${RUNNER_TEMP}/azurite" &
          # Wait for Azurite to accept connections (it answers the bare account
          # URL with HTTP 400, which still means the service is up).
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              echo "Azurite ready on attempt $i"
              break
            fi
            echo "Waiting for Azurite... attempt $i"
            sleep 1
          done

      - name: Start Azurite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\azurite" | Out-Null
          Start-Process -FilePath "azurite.cmd" -ArgumentList '--silent', '--location', "$env:RUNNER_TEMP\azurite"
          for ($i = 1; $i -le 30; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri http://127.0.0.1:10000/devstoreaccount1 | Out-Null
              Write-Host "Azurite ready on attempt $i"
              break
            } catch {
              # A non-2xx HTTP response (e.g. 400) still means Azurite is up.
              if ($null -ne $_.Exception.Response) {
                Write-Host "Azurite ready on attempt $i (HTTP status)"
                break
              }
              Write-Host "Waiting for Azurite... attempt $i"
              Start-Sleep -Seconds 1
            }
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B build-bcvfs
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=ON

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build-bcvfs
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=ON
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B build-bcvfs
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_SHARED_LIBS=OFF
          -DSQLITEX_BUILD_TESTS=ON
          -DSQLITEX_BUILD_EXAMPLES=ON
          -DSQLITEX_BCVFS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build-bcvfs --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-bcvfs --build-config Debug --output-on-failure --parallel
