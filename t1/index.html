<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Tesla Model Y - 3D Configurator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; background: #1a1a2e; }
  #canvas-container { width: 100vw; height: 100vh; }
  #ui {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    background: rgba(20,20,40,0.85); backdrop-filter: blur(16px);
    padding: 18px 28px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12);
    z-index: 10;
  }
  .control-group { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 80px; }
  .control-group label { color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .color-options, .wheel-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .color-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer; transition: all 0.2s;
  }
  .color-btn:hover { transform: scale(1.15); border-color: #fff; }
  .color-btn.active { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.5); }
  .wheel-btn {
    padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #ccc; cursor: pointer;
    font-size: 12px; transition: all 0.2s; white-space: nowrap;
  }
  .wheel-btn:hover { background: rgba(255,255,255,0.15); }
  .wheel-btn.active { background: rgba(255,255,255,0.2); border-color: #fff; color: #fff; }
  .interior-options { display: flex; gap: 8px; }
  .interior-btn {
    width: 28px; height: 28px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer; transition: all 0.2s;
  }
  .interior-btn:hover { transform: scale(1.15); }
  .interior-btn.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
  #title {
    position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 28px; font-weight: 700; letter-spacing: 2px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5); z-index: 10;
  }
  #subtitle {
    position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
    color: #888; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; z-index: 10;
  }
  @media (max-width: 768px) {
    #ui { padding: 12px 16px; gap: 10px; bottom: 16px; border-radius: 14px; }
    .color-btn { width: 26px; height: 26px; }
    #title { font-size: 20px; top: 16px; }
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="title">Tesla Model Y</div>
<div id="subtitle">3D Configurator</div>
<div id="ui">
  <div class="control-group">
    <label>Paint</label>
    <div class="color-options" id="paint-colors"></div>
  </div>
  <div class="control-group">
    <label>Wheels</label>
    <div class="wheel-options" id="wheel-options"></div>
  </div>
  <div class="control-group">
    <label>Interior</label>
    <div class="interior-options" id="interior-colors"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene ────────────────────────────────────────
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 8, 40);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(4.5, 2.2, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ─── Lighting ─────────────────────────────────────
scene.add(new THREE.AmbientLight(0x404060, 1.5));
scene.add(new THREE.HemisphereLight(0xddeeff, 0x3a3040, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 8);
sun.position.set(8, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 50;
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0001; sun.shadow.normalBias = 0.02;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8899cc, 3);
fill.position.set(-3, 2, -2); scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 4);
rim.position.set(0, 3, -6); scene.add(rim);

const under = new THREE.DirectionalLight(0x4466aa, 2);
under.position.set(0, -1, 3); scene.add(under);

// ─── Ground ───────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.6, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2; ground.position.y = -1.35;
ground.receiveShadow = true; scene.add(ground);

const grid = new THREE.PolarGridHelper(6, 48, 36, 128, 0x444466, 0x333350);
grid.position.y = -1.348; scene.add(grid);

// ─── Controls ─────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 2.5; controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.65; controls.minPolarAngle = 0.3;
controls.update();

// ─── Car root ─────────────────────────────────────
const car = new THREE.Group(); scene.add(car);
const bodyMaterials = [];
const interiorMaterials = [];
let wheelGroup;

// ═══════════════════════════════════════════════════════════
//  SMOOTH PARAMETRIC BODY via sin-based cross-section
//  profiles + cosine interpolation along the car length
// ═══════════════════════════════════════════════════════════

const PROF_PTS = 32;   // samples per cross-section (must be even for mirroring)
const HALF = PROF_PTS / 2; // 16 points for right half + center

/**
 * Generate a single cross-section profile (right half) using
 * a two-zone sin-curve: wide lower body + narrower upper body / greenhouse.
 *
 * All sin exponents are < 1 to produce flat-ish sides (car-like),
 * not perfectly round (bubble-like).
 */
function makeProfile(params) {
  const {
    btmY      = 0.19,   // center-bottom y
    lowW      = 0.92,   // max half-width of lower body
    lowExp    = 0.55,   // sin exponent for lower body (<1 = flatter sides)
    beltY     = 0.64,   // beltline y
    beltT     = 0.54,   // where beltline sits in t-space (0..1)
    hasCabin  = false,  // greenhouse present?
    upW       = 0.78,   // max half-width of upper body / greenhouse
    upExp     = 0.65,   // sin exponent for upper body
    roofY     = 1.30,   // roof center y (only if hasCabin)
    topY      = 0.84,   // body-top y (if !hasCabin)
  } = params;

  const pts = [];
  for (let i = 0; i < HALF; i++) {
    const t = i / (HALF - 1); // 0 (ctr-bottom) → 1 (ctr-top)
    let x, y;

    if (t <= beltT) {
      // ── Lower body: center-bottom → beltline ──
      const s = t / beltT;
      x = lowW * Math.pow(Math.sin(s * Math.PI / 2), lowExp);
      y = btmY + (beltY - btmY) * s;
    } else {
      // ── Upper body / greenhouse: beltline → center-top ──
      const s = (t - beltT) / (1 - beltT);
      const w = hasCabin ? upW : upW;
      const top = hasCabin ? roofY : topY;
      x = w * Math.pow(Math.sin(s * Math.PI / 2), upExp);
      y = beltY + (top - beltY) * s;
    }
    pts.push([Math.max(0, x), y]);
  }
  return pts;
}

// Cosine interpolation (smoothstep) between two values
function cosLerp(a, b, t) { return a + (b - a) * (t * t * (3 - 2 * t)); }

// Interpolate two profiles point by point
function lerpProfile(pA, pB, t) {
  return pA.map(([xa, ya], i) => {
    const [xb, yb] = pB[i];
    return [cosLerp(xa, xb, t), cosLerp(ya, yb, t)];
  });
}

// ── KEY STATIONS (14 anchor profiles along the car) ──
// Ordered front (z+) → rear (z-)
function getKeyStations() {
  return [
    // z, params for makeProfile()
    { z: 2.35, p: { btmY:0.20, lowW:0.52, lowExp:0.80, beltY:0.46, beltT:0.52, hasCabin:false, upW:0.30, upExp:0.72, topY:0.60 } },
    { z: 2.10, p: { btmY:0.19, lowW:0.78, lowExp:0.60, beltY:0.54, beltT:0.54, hasCabin:false, upW:0.52, upExp:0.66, topY:0.70 } },
    { z: 1.75, p: { btmY:0.19, lowW:0.90, lowExp:0.50, beltY:0.62, beltT:0.55, hasCabin:false, upW:0.66, upExp:0.58, topY:0.79 } },
    { z: 1.30, p: { btmY:0.19, lowW:0.92, lowExp:0.46, beltY:0.66, beltT:0.55, hasCabin:false, upW:0.74, upExp:0.54, topY:0.84 } },
    { z: 0.80, p: { btmY:0.19, lowW:0.92, lowExp:0.44, beltY:0.68, beltT:0.56, hasCabin:false, upW:0.78, upExp:0.52, topY:0.88 } },
    { z: 0.40, p: { btmY:0.19, lowW:0.92, lowExp:0.44, beltY:0.65, beltT:0.55, hasCabin:true,  upW:0.82, upExp:0.62, roofY:1.14 } },
    { z: 0.00, p: { btmY:0.19, lowW:0.92, lowExp:0.44, beltY:0.64, beltT:0.55, hasCabin:true,  upW:0.79, upExp:0.66, roofY:1.26 } },
    { z:-0.45, p: { btmY:0.19, lowW:0.92, lowExp:0.44, beltY:0.64, beltT:0.55, hasCabin:true,  upW:0.76, upExp:0.66, roofY:1.30 } },
    { z:-0.85, p: { btmY:0.19, lowW:0.92, lowExp:0.44, beltY:0.64, beltT:0.55, hasCabin:true,  upW:0.72, upExp:0.62, roofY:1.22 } },
    { z:-1.20, p: { btmY:0.19, lowW:0.92, lowExp:0.45, beltY:0.64, beltT:0.55, hasCabin:true,  upW:0.64, upExp:0.56, roofY:1.06 } },
    { z:-1.55, p: { btmY:0.19, lowW:0.92, lowExp:0.46, beltY:0.64, beltT:0.55, hasCabin:false, upW:0.72, upExp:0.50, topY:0.87 } },
    { z:-1.88, p: { btmY:0.19, lowW:0.88, lowExp:0.50, beltY:0.60, beltT:0.54, hasCabin:false, upW:0.62, upExp:0.52, topY:0.80 } },
    { z:-2.15, p: { btmY:0.19, lowW:0.74, lowExp:0.62, beltY:0.52, beltT:0.53, hasCabin:false, upW:0.42, upExp:0.60, topY:0.68 } },
    { z:-2.35, p: { btmY:0.20, lowW:0.46, lowExp:0.78, beltY:0.42, beltT:0.52, hasCabin:false, upW:0.24, upExp:0.70, topY:0.56 } },
  ];
}

// Generate all profiles (key stations → dense intermediate set)
function generateAllStations(numTotal) {
  const keys = getKeyStations();
  const allStations = [];

  for (let i = 0; i < numTotal; i++) {
    const t = i / (numTotal - 1); // 0 (front) → 1 (rear)
    const globalZ = cosLerp(keys[0].z, keys[keys.length - 1].z, t);

    // Find surrounding key stations
    let k0 = 0, k1 = keys.length - 1;
    for (let j = 0; j < keys.length - 1; j++) {
      if (globalZ <= keys[j].z && globalZ >= keys[j + 1].z) { k0 = j; k1 = j + 1; break; }
    }
    const localT = (globalZ - keys[k0].z) / (keys[k1].z - keys[k0].z);
    const p0 = makeProfile(keys[k0].p);
    const p1 = makeProfile(keys[k1].p);
    const pts = lerpProfile(p0, p1, Math.max(0, Math.min(1, localT)));

    allStations.push({ z: globalZ, pts, hasCabin: keys[Math.round((k0 + k1) / 2)].p.hasCabin });
  }
  return allStations;
}

// Build a smooth lofted mesh from the station array
function loftMesh(stations, material) {
  const verts = [];
  const idx = [];
  const starts = [];
  const loopN = HALF * 2 - 2; // vertices per full loop (mirrored, minus duplicated centerline ends)

  for (const st of stations) {
    const s = verts.length / 3; starts.push(s);
    const pts = st.pts;
    // Right half
    for (let i = 0; i < HALF; i++) verts.push(pts[i][0], pts[i][1], st.z);
    // Left half (mirror, skip endpoints on centerline)
    for (let i = HALF - 2; i >= 1; i--) verts.push(-pts[i][0], pts[i][1], st.z);
  }

  for (let si = 0; si < starts.length - 1; si++) {
    const a0 = starts[si], b0 = starts[si + 1];
    for (let j = 0; j < loopN; j++) {
      const a = a0 + j, b = a0 + (j + 1) % loopN;
      const c = b0 + j, d = b0 + (j + 1) % loopN;
      idx.push(a, c, b); idx.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

// ─── Window glass: lofted mesh only over cabin zone ───
function loftWindows(bodyStations, material) {
  const cabin = bodyStations.filter(s => s.hasCabin);
  if (cabin.length < 2) return new THREE.Group();

  const winStations = cabin.map(st => {
    const wPts = [];
    for (let i = 0; i < HALF; i++) {
      const t = i / (HALF - 1);
      const [bx, by] = st.pts[i];
      // Glass is slightly inset and starts above the beltline
      if (t < 0.48) {
        // Below beltline: pinch to near-center
        const s = t / 0.48;
        wPts.push([bx * 0.15 * s, by]);
      } else {
        // Greenhouse glass: follow body contour, slightly inset
        wPts.push([Math.max(0, bx - 0.012), by]);
      }
    }
    return { z: st.z, pts: wPts, hasCabin: true };
  });
  return loftMesh(winStations, material);
}

// ─── Build entire car ──────────────────────────────
function buildCar(bodyHex, interiorHex, wheelStyle) {
  while (car.children.length > 0) { dispose(car.children[0]); car.remove(car.children[0]); }
  bodyMaterials.length = 0;
  interiorMaterials.length = 0;

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: bodyHex, roughness: 0.22, metalness: 0.65,
    clearcoat: 0.4, clearcoatRoughness: 0.15,
  });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.35, metalness: 0.3 });
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x08081a, roughness: 0.02, metalness: 0.05,
    transmission: 0.25, thickness: 0.06, ior: 1.52, envMapIntensity: 0.5,
  });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.12, metalness: 0.95 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.45, metalness: 0.15 });
  const redLight = new THREE.MeshStandardMaterial({ color: 0xff2222, roughness: 0.1, metalness: 0.1, emissive: 0x330000, emissiveIntensity: 0.4 });
  const whiteLight = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05, metalness: 0.05, emissive: 0xffffff, emissiveIntensity: 1.8 });
  const intMat = new THREE.MeshStandardMaterial({ color: interiorHex, roughness: 0.55, metalness: 0.05 });

  // ── Generate stations & loft body ──
  const stations = generateAllStations(28);
  const bodyMesh = loftMesh(stations, bodyMat);
  car.add(bodyMesh); bodyMaterials.push(bodyMesh);

  // ── Underbody tray ──
  const tray = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.06, 4.1), darkMat);
  tray.position.y = 0.14; tray.castShadow = true; tray.receiveShadow = true;
  car.add(tray);

  // ── Windows ──
  car.add(loftWindows(stations, glassMat));

  // ── Side window dividers (B/C pillars) ──
  for (let side = -1; side <= 1; side += 2) {
    const bp = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.34, 0.05), trimMat);
    bp.position.set(side * 0.78, 1.04, 0.15); car.add(bp);
  }

  // ── Front nose cap (half-ellipsoid) ──
  const noseGeo = new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2);
  const nose = new THREE.Mesh(noseGeo, bodyMat);
  nose.scale.set(0.60, 0.34, 0.28); nose.position.set(0, 0.32, 2.42);
  nose.castShadow = true; car.add(nose); bodyMaterials.push(nose);

  // ── Rear cap ──
  const rearGeo = new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 2, 0, Math.PI / 2);
  const rearCap = new THREE.Mesh(rearGeo, bodyMat);
  rearCap.scale.set(0.54, 0.36, 0.26); rearCap.position.set(0, 0.34, -2.42);
  rearCap.rotation.x = Math.PI; rearCap.castShadow = true;
  car.add(rearCap); bodyMaterials.push(rearCap);

  // ── Front fascia details ──
  const intake = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.07, 0.06), trimMat);
  intake.position.set(0, 0.24, 2.42); car.add(intake);

  const logoBar = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.016, 0.02), chromeMat);
  logoBar.position.set(0, 0.52, 2.40); car.add(logoBar);

  // ── Side skirts ──
  for (let side = -1; side <= 1; side += 2) {
    const sk = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.07, 3.6), trimMat);
    sk.position.set(side * 0.88, 0.17, -0.1); sk.castShadow = true; car.add(sk);
  }

  // ── Headlights ──
  for (let side = -1; side <= 1; side += 2) {
    const sx = side * 0.54;
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.055, 0.035), whiteLight);
    hl.position.set(sx, 0.48, 2.38); hl.rotation.y = 0.06 * side; car.add(hl);
    const drl = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.013, 0.025), whiteLight);
    drl.position.set(sx, 0.44, 2.39); drl.rotation.y = 0.06 * side; car.add(drl);
  }

  // ── Taillights ──
  for (let side = -1; side <= 1; side += 2) {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.045, 0.035), redLight);
    tl.position.set(side * 0.52, 0.70, -2.38); car.add(tl);
  }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.82, 0.022, 0.035), redLight);
  bar.position.set(0, 0.75, -2.38); car.add(bar);

  // ── Side mirrors ──
  for (let side = -1; side <= 1; side += 2) {
    const ma = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.05, 0.05), bodyMat);
    ma.position.set(side * 0.83, 1.00, 1.55); car.add(ma); bodyMaterials.push(ma);
    const mr = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.09, 0.13), trimMat);
    mr.position.set(side * 0.92, 1.04, 1.55); car.add(mr);
  }

  // ── Door handles ──
  for (let side = -1; side <= 1; side += 2) {
    for (let z = 0.60; z >= -0.80; z -= 1.4) {
      const dh = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.022, 0.15), chromeMat);
      dh.position.set(side * 0.875, 0.66, z); car.add(dh);
    }
  }

  // ── Wheel arch trim ──
  for (let side = -1; side <= 1; side += 2) {
    for (let z of [1.55, -1.55]) {
      const arch = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.022, 8, 14, Math.PI), trimMat);
      arch.position.set(side * 0.86, 0.38, z);
      arch.rotation.set(0, 0, side * Math.PI / 2);
      arch.rotation.y = Math.PI / 2; car.add(arch);
    }
  }

  // ── Wheels ──
  wheelGroup = new THREE.Group(); car.add(wheelGroup);
  buildWheels(wheelStyle);

  // ── Interior ──
  const dashGeo = new THREE.BoxGeometry(1.22, 0.10, 0.44);
  const dash = new THREE.Mesh(dashGeo, intMat);
  dash.position.set(0, 0.80, 1.25); dash.castShadow = true; car.add(dash);
  interiorMaterials.push(dash);

  const screenGeo = new THREE.BoxGeometry(0.30, 0.20, 0.02);
  const screenMat = new THREE.MeshStandardMaterial({ color: 0x0a0a28, roughness: 0.08, metalness: 0.4, emissive: 0x000822, emissiveIntensity: 0.6 });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.set(0, 0.84, 1.24); screen.rotation.x = -0.08; car.add(screen);

  const colGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.26, 12);
  const col = new THREE.Mesh(colGeo, trimMat);
  col.position.set(0.33, 0.76, 1.18); col.rotation.x = Math.PI / 3.5; col.rotation.z = Math.PI / 2; car.add(col);

  const swGeo = new THREE.TorusGeometry(0.12, 0.017, 8, 20);
  const sw = new THREE.Mesh(swGeo, trimMat);
  sw.position.set(0.38, 0.82, 1.28); car.add(sw);

  for (let side = -0.32; side <= 0.32; side += 0.64) {
    const cGeo = new THREE.BoxGeometry(0.27, 0.07, 0.35);
    const c = new THREE.Mesh(cGeo, intMat); c.position.set(side, 0.47, 0.94); car.add(c);
    interiorMaterials.push(c);
    const bGeo = new THREE.BoxGeometry(0.25, 0.40, 0.07);
    const bk = new THREE.Mesh(bGeo, intMat); bk.position.set(side, 0.68, 0.80);
    bk.rotation.x = 0.18; car.add(bk); interiorMaterials.push(bk);
    const hGeo = new THREE.BoxGeometry(0.17, 0.10, 0.05);
    const hr = new THREE.Mesh(hGeo, intMat); hr.position.set(side, 0.90, 0.69); car.add(hr);
    interiorMaterials.push(hr);
  }

  const rcGeo = new THREE.BoxGeometry(1.12, 0.07, 0.33);
  const rc = new THREE.Mesh(rcGeo, intMat); rc.position.set(0, 0.45, -0.58); car.add(rc);
  interiorMaterials.push(rc);
  const rbGeo = new THREE.BoxGeometry(1.08, 0.36, 0.06);
  const rb = new THREE.Mesh(rbGeo, intMat); rb.position.set(0, 0.64, -0.74);
  rb.rotation.x = 0.12; car.add(rb); interiorMaterials.push(rb);

  const conGeo = new THREE.BoxGeometry(0.15, 0.08, 0.82);
  const con = new THREE.Mesh(conGeo, trimMat); con.position.set(0, 0.50, 0.84); car.add(con);

  const diffGeo = new THREE.BoxGeometry(1.46, 0.04, 0.13);
  const diff = new THREE.Mesh(diffGeo, trimMat); diff.position.set(0, 0.16, -2.34); car.add(diff);
}

// ─── Wheels ────────────────────────────────────────
function buildWheels(style) {
  while (wheelGroup.children.length > 0) { dispose(wheelGroup.children[0]); wheelGroup.remove(wheelGroup.children[0]); }

  const positions = [
    { x: 0.86, y: 0.38, z: 1.55 }, { x: -0.86, y: 0.38, z: 1.55 },
    { x: 0.86, y: 0.38, z: -1.55 }, { x: -0.86, y: 0.38, z: -1.55 },
  ];
  const styles = {
    gemini:      { spokes:7, rimC:0xd0d0d0, spkC:0xb0b0b0, rr:0.36, tw:0.20 },
    induction:   { spokes:5, rimC:0x383838, spkC:0x282828, rr:0.38, tw:0.22 },
    uberturbine: { spokes:10,rimC:0x909090, spkC:0x707070, rr:0.40, tw:0.24 },
  };
  const cfg = styles[style] || styles.gemini;
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.85, metalness: 0.03 });

  positions.forEach((pos, idx) => {
    const a = new THREE.Group();
    const tire = new THREE.Mesh(new THREE.TorusGeometry(cfg.rr, cfg.tw / 2, 16, 48), tireMat);
    tire.rotation.y = Math.PI / 2; tire.castShadow = true; tire.receiveShadow = true; a.add(tire);

    const sw = new THREE.Mesh(new THREE.CylinderGeometry(cfg.rr + 0.02, cfg.rr + 0.02, cfg.tw * 0.65, 48), tireMat);
    sw.rotation.z = Math.PI / 2; sw.castShadow = true; a.add(sw);

    const rim = new THREE.Mesh(
      new THREE.CylinderGeometry(cfg.rr - 0.03, cfg.rr - 0.03, cfg.tw * 0.45, 48),
      new THREE.MeshStandardMaterial({ color: cfg.rimC, roughness: 0.18, metalness: 0.92 })
    );
    rim.rotation.z = Math.PI / 2; rim.castShadow = true; a.add(rim);

    const spkMat = new THREE.MeshStandardMaterial({ color: cfg.spkC, roughness: 0.22, metalness: 0.88 });
    for (let s = 0; s < cfg.spokes; s++) {
      const angle = (s / cfg.spokes) * Math.PI * 2;
      const spk = new THREE.Mesh(new THREE.BoxGeometry(cfg.tw * 0.28, 0.014, cfg.rr * 0.78), spkMat);
      spk.position.set(Math.cos(angle) * cfg.rr * 0.32, Math.sin(angle) * cfg.rr * 0.32, 0);
      spk.rotation.z = angle; spk.castShadow = true; a.add(spk);
    }

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, cfg.tw * 0.28, 16),
      new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.08, metalness: 0.96 })
    );
    cap.rotation.z = Math.PI / 2; a.add(cap);

    const brake = new THREE.Mesh(
      new THREE.CylinderGeometry(cfg.rr * 0.58, cfg.rr * 0.58, cfg.tw * 0.12, 32),
      new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.28, metalness: 0.92 })
    );
    brake.rotation.z = Math.PI / 2; a.add(brake);

    const cal = new THREE.Mesh(
      new THREE.BoxGeometry(cfg.tw * 0.14, 0.07, cfg.rr * 0.35),
      new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.18, metalness: 0.7 })
    );
    cal.position.set(0, cfg.rr * 0.52, 0); a.add(cal);

    a.position.set(pos.x, pos.y, pos.z);
    a.rotation.z = (idx % 2 === 0) ? 0 : Math.PI;
    wheelGroup.add(a);
  });
}

// ─── Update fns ────────────────────────────────────
function updateBodyColor(hex) { bodyMaterials.forEach(m => m.color?.set(hex)); }
function updateInteriorColor(hex) { interiorMaterials.forEach(m => m.color?.set(hex)); }
function updateWheels(style) { buildWheels(style); }

function dispose(obj) {
  if (obj.geometry) obj.geometry.dispose();
  if (obj.material) {
    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
    else obj.material.dispose();
  }
  while (obj.children && obj.children.length > 0) { dispose(obj.children[0]); obj.remove(obj.children[0]); }
}

// ─── Build ─────────────────────────────────────────
buildCar('#e82127', '#111111', 'gemini');

// ─── UI ────────────────────────────────────────────
const paintColors = [
  { name: 'Red Multi-Coat', hex: '#e82127' },
  { name: 'Pearl White', hex: '#f5f5f0' },
  { name: 'Midnight Silver', hex: '#4a4e54' },
  { name: 'Deep Blue', hex: '#1c3f6e' },
  { name: 'Solid Black', hex: '#1a1a1a' },
  { name: 'Quicksilver', hex: '#a8b2b8' },
  { name: 'Ultra Red', hex: '#cc0000' },
];
const wheelStyles = [
  { id: 'gemini', name: '19" Gemini' },
  { id: 'induction', name: '20" Induction' },
  { id: 'uberturbine', name: '21" Uberturbine' },
];
const interiorColors = [
  { name: 'Black', hex: '#1a1a1a' },
  { name: 'White', hex: '#e8e5df' },
  { name: 'Black & White', hex: '#d5d0c8' },
];

document.getElementById('paint-colors').append(...paintColors.map((c, i) => {
  const b = document.createElement('div');

  b.textContent = w.name;

    document.querySelectorAll('#wheel-options .wheel-btn').forEach(x => x.classList.remove('active'));

document.getElementById('interior-colors').append(...interiorColors.map((c, i) => {

  };
  return b;
}));

// ─── Loop ──────────────────────────────────────────
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { camera.position.set(4.5, 2.2, 5.5); controls.target.set(0, 0.3, 0); }
  if (k === 'f') { camera.position.set(0, 0.5, 6.5); controls.target.set(0, 0.3, 0); }
  if (k === 'b') { camera.position.set(0, 0.8, -5.5); controls.target.set(0, 0.3, 0); }
  if (k === 's') { camera.position.set(6, 0.5, 0); controls.target.set(0, 0.3, 0); }
  if (k === 't') { camera.position.set(2, 5.5, 2); controls.target.set(0, 0.3, 0); }
  controls.update();
});

animate();
